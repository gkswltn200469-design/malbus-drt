name: 🐛 버그 수정
description: 버그를 보고하거나 수정할 때 사용합니다.
title: "[Fix] "
labels: ["bug"]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: ❗ 발생한 문제
      placeholder: 어떤 문제가 발생했는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 기대 결과
      placeholder: 정상적으로 동작했을 경우의 결과를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 💻 실행 환경
      placeholder: 예) Chrome / Windows / Node 24

  - type: textarea
    id: extra
    attributes:
      label: 📎 추가 정보
      description: 실제 통화 음성, 개인정보, API 키는 올리지 마세요.
      placeholder: 스크린샷, 로그 등
