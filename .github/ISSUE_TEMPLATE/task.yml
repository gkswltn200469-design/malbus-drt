name: 🔧 기타 작업
description: 문서, 설정, 리팩토링처럼 기능 추가와 버그 수정이 아닌 작업에 사용합니다.
title: "[유형] "

body:
  - type: textarea
    id: task-desc
    attributes:
      label: 📌 작업 설명
      placeholder: 어떤 작업인가요?
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 🛠 작업 내용
      placeholder: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: reference
    attributes:
      label: 🔗 참고 자료
      placeholder: 관련 문서, 링크 등
