name: ✨ 기능 추가
description: 새로운 기능을 구현할 때 사용합니다.
title: "[Feat] "
labels: ["enhancement"]

body:
  - type: textarea
    id: feature-desc
    attributes:
      label: 📌 기능 설명
      placeholder: 어떤 기능인가요?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 🤔 필요한 이유
      placeholder: 왜 이 기능이 필요한가요?
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 🛠 작업 내용
      placeholder: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: reference
    attributes:
      label: 🔗 참고 자료
      placeholder: 관련 문서, 화면 설계, 링크 등
