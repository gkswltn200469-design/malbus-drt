server.port=8080

malbus.data-dir=../data
spring.datasource.url=jdbc:sqlite:${malbus.data-dir}/malbus.db?foreign_keys=on
# sqlite는 쓰기가 한 번에 하나라 연결 1개로
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# 저장소 루트의 .env(키=값, 따옴표 없이)도 읽음. .gitignore에 있어서 안 올라감. 없으면 무시
spring.config.import=optional:file:../.env[.properties]

# llm 키는 환경 변수나 .env로만. GEMINI_API_KEY 우선, 없으면 ANTHROPIC_API_KEY, 둘 다 없으면 규칙 모드
malbus.llm.gemini.api-key=${GEMINI_API_KEY:}
# 3.8-flash는 11/16 무료 등급에서 응답이 60초 넘게 안 와서 3.6-flash로 둠. 바꾸려면 .env에 GEMINI_MODEL=
malbus.llm.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
malbus.llm.claude.api-key=${ANTHROPIC_API_KEY:}
malbus.llm.claude.model=claude-sonnet-5-5
# llm 호출이 실패하면(네트워크, 형식 오류 등) 규칙 추출로 대신함. 시연이 멈추지 않게
malbus.llm.fallback-to-rule=true
