server.port=8080

malbus.data-dir=../data
spring.datasource.url=jdbc:sqlite:${malbus.data-dir}/malbus.db?foreign_keys=on
# sqlite는 쓰기가 한 번에 하나라 연결 1개로
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# llm 키는 환경 변수로만. 비어 있으면 규칙 모드
malbus.llm.api-key=${ANTHROPIC_API_KEY:}
malbus.llm.model=claude-sonnet-5-5
# llm 호출이 실패하면(네트워크, 형식 오류 등) 규칙 추출로 대신함. 시연이 멈추지 않게
malbus.llm.fallback-to-rule=true
